<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Pulse</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0b0e;
        transition: opacity 0.55s ease, transform 0.55s ease;
        user-select: none;
      }
      #boot-splash.done {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .splash-logo {
        width: 64px;
        height: 62px;
        animation: splash-pulse 3.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(134, 59, 255, 0.25)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(134, 59, 255, 0.5)); }
      }
      .splash-name {
        font-family: "Space Grotesk", Inter, -apple-system, system-ui, sans-serif;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #f2f3f5;
      }
      .splash-bar {
        position: relative;
        width: 184px;
        height: 3px;
        margin-top: 6px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .splash-bar span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #863bff, #b18cff);
        transition: width 0.12s linear;
      }
      .splash-status {
        font-family: Inter, -apple-system, system-ui, sans-serif;
        font-size: 11.5px;
        color: #5c6068;
        letter-spacing: 0.02em;
        transition: opacity 0.35s ease;
        min-height: 15px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="splash-inner">
        <svg class="splash-logo" viewBox="0 0 48 46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"/>
        </svg>
        <div class="splash-name">PULSE</div>
        <div class="splash-bar"><span id="splash-bar-fill"></span></div>
        <div class="splash-status" id="splash-status">Инициализация…</div>
      </div>
    </div>
    <script>
      ;(function () {
        var el = document.getElementById('splash-status')
        if (!el) return
        var msgs = ['Загружаем настройки', 'Синхронизируем задачи', 'Строим расписание', 'Готовим статистику']
        var i = 0
        setInterval(function () {
          i = (i + 1) % msgs.length
          el.style.opacity = '0'
          setTimeout(function () {
            el.textContent = msgs[i] + '…'
            el.style.opacity = '1'
          }, 350)
        }, 2400)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
