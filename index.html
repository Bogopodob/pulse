<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Pulse</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0b0e;
        transition: opacity 0.55s ease, transform 0.55s ease;
        user-select: none;
      }
      #boot-splash.done {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .splash-logo {
        width: 72px;
        height: 70px;
        animation: splash-pulse 3.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(134, 59, 255, 0.25)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(134, 59, 255, 0.5)); }
      }
      .splash-name {
        font-family: "Space Grotesk", Inter, -apple-system, system-ui, sans-serif;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #f2f3f5;
      }
      .splash-bar {
        position: relative;
        width: 184px;
        height: 3px;
        margin-top: 6px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .splash-bar span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #863bff, #b18cff);
        transition: width 0.12s linear;
      }
      .splash-status {
        font-family: Inter, -apple-system, system-ui, sans-serif;
        font-size: 11.5px;
        color: #5c6068;
        letter-spacing: 0.02em;
        transition: opacity 0.35s ease;
        min-height: 15px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="splash-inner">
        <svg class="splash-logo" viewBox="0 0 1268 1241" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pulse logo">
          <defs>
            <linearGradient id="splashRingTop" x1="185" y1="625" x2="798" y2="172" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#8B49FD"/>
              <stop offset="45%" stop-color="#6E5DFC"/>
              <stop offset="100%" stop-color="#4468FC"/>
            </linearGradient>
            <linearGradient id="splashRingBottom" x1="218" y1="773" x2="1059" y2="787" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#8B49FD"/>
              <stop offset="25%" stop-color="#4468FC"/>
              <stop offset="75%" stop-color="#4468FC"/>
              <stop offset="100%" stop-color="#8B49FD"/>
            </linearGradient>
            <linearGradient id="splashPulseGrad" x1="106" y1="707" x2="1161" y2="707" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#06E1C6"/>
              <stop offset="30%" stop-color="#06D7D0"/>
              <stop offset="52%" stop-color="#02C8F6"/>
              <stop offset="75%" stop-color="#0FE2C4"/>
              <stop offset="100%" stop-color="#23F7A9"/>
            </linearGradient>
            <linearGradient id="splashCheckGrad" x1="703" y1="522" x2="928" y2="418" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#0FE2C0"/>
              <stop offset="100%" stop-color="#2AF9A2"/>
            </linearGradient>
          </defs>
          <path d="M 185.13 625.42 A 457 457 0 0 1 797.80 172.06" fill="none" stroke="url(#splashRingTop)" stroke-width="61" stroke-linecap="round"/>
          <path d="M 217.78 772.70 A 457 457 0 0 0 1058.99 787.38" fill="none" stroke="url(#splashRingBottom)" stroke-width="61" stroke-linecap="round"/>
          <path d="M 1091.55 680.84 A 457 457 0 0 0 1085.88 494.84" fill="none" stroke="#8B49FD" stroke-width="61" stroke-linecap="round"/>
          <path d="M 106,707 L 405,703 L 535,383 L 725,888 L 830,707 L 1161,707" fill="none" stroke="url(#splashPulseGrad)" stroke-width="61" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 703,522 L 760,600 L 928,418" fill="none" stroke="url(#splashCheckGrad)" stroke-width="61" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="splash-name">PULSE</div>
        <div class="splash-bar"><span id="splash-bar-fill"></span></div>
        <div class="splash-status" id="splash-status">Инициализация…</div>
      </div>
    </div>
    <script>
      ;(function () {
        var el = document.getElementById('splash-status')
        if (!el) return
        var msgs = ['Загружаем настройки', 'Синхронизируем задачи', 'Строим расписание', 'Готовим статистику']
        var i = 0
        setInterval(function () {
          i = (i + 1) % msgs.length
          el.style.opacity = '0'
          setTimeout(function () {
            el.textContent = msgs[i] + '…'
            el.style.opacity = '1'
          }, 350)
        }, 2400)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
