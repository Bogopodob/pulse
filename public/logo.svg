<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1268 1241">
  <defs>
    <linearGradient id="ringTop" x1="185" y1="625" x2="798" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B49FD"/>
      <stop offset="45%" stop-color="#6E5DFC"/>
      <stop offset="100%" stop-color="#4468FC"/>
    </linearGradient>
    <linearGradient id="ringBottom" x1="218" y1="773" x2="1059" y2="787" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B49FD"/>
      <stop offset="25%" stop-color="#4468FC"/>
      <stop offset="75%" stop-color="#4468FC"/>
      <stop offset="100%" stop-color="#8B49FD"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="106" y1="707" x2="1161" y2="707" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06E1C6"/>
      <stop offset="30%" stop-color="#06D7D0"/>
      <stop offset="52%" stop-color="#02C8F6"/>
      <stop offset="75%" stop-color="#0FE2C4"/>
      <stop offset="100%" stop-color="#23F7A9"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="703" y1="522" x2="928" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0FE2C0"/>
      <stop offset="100%" stop-color="#2AF9A2"/>
    </linearGradient>
  </defs>

  <!-- Ring: top-left long arc -->
  <path d="M 185.13 625.42 A 457 457 0 0 1 797.80 172.06"
        fill="none" stroke="url(#ringTop)" stroke-width="61" stroke-linecap="round"/>

  <!-- Ring: bottom long arc -->
  <path d="M 217.78 772.70 A 457 457 0 0 0 1058.99 787.38"
        fill="none" stroke="url(#ringBottom)" stroke-width="61" stroke-linecap="round"/>

  <!-- Ring: short right arc -->
  <path d="M 1091.55 680.84 A 457 457 0 0 0 1085.88 494.84"
        fill="none" stroke="#8B49FD" stroke-width="61" stroke-linecap="round"/>

  <!-- Decorative dashes -->
  <rect x="-50" y="-21" width="100" height="42" rx="21" ry="21"
        fill="#8B49FD" transform="translate(866,217) rotate(-149.7)"/>
  <rect x="-60" y="-22" width="120" height="44" rx="22" ry="22"
        fill="#8B49FD" transform="translate(978,302) rotate(-131.6)"/>
  <rect x="-50" y="-20" width="100" height="40" rx="20" ry="20"
        fill="#8B49FD" transform="translate(1054,417) rotate(-114.1)"/>

  <!-- Pulse / EKG line -->
  <path d="M 106,707 L 405,703 L 535,383 L 725,888 L 830,707 L 1161,707"
        fill="none" stroke="url(#pulseGrad)" stroke-width="61"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Checkmark -->
  <path d="M 703,522 L 760,600 L 928,418"
        fill="none" stroke="url(#checkGrad)" stroke-width="61"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
